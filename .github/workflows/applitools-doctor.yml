name: Applitools setup check
on:
  # workflow_dispatch in the README; it only fires from the default branch.
  push:
    branches: [github-action-gate]

permissions:
  pull-requests: read

jobs:
  doctor:
    runs-on: ubuntu-latest
    steps:
      - uses: applitools/eyes-github-action@2e1a1cce760574103f9d1b4dc3a5cd8d3e8bcb1f
        with:
          mode: doctor
          apiKey: ${{ secrets.APPLITOOLS_API_KEY }}
          readApiKey: ${{ secrets.APPLITOOLS_READ_KEY }}
          mergeApiKey: ${{ secrets.APPLITOOLS_MERGE_KEY }}
