name: Applitools baseline merge
on:
  # As above: pull_request_target in the README.
  pull_request:
    types: [closed]

permissions:
  checks: write
  pull-requests: read

concurrency: applitools-merge-${{ github.event.pull_request.base.ref }}

jobs:
  merge:
    if: github.event.pull_request.merged == true
    runs-on: ubuntu-latest
    steps:
      - uses: applitools/eyes-github-action@ed47ebf1b6033717fe1581c459b02f28177f2993
        with:
          mode: merge
          apiKey: ${{ secrets.APPLITOOLS_API_KEY }}
          mergeApiKey: ${{ secrets.APPLITOOLS_MERGE_KEY }}
