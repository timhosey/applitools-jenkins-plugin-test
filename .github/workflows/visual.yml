name: Visual tests
on:
  pull_request:
  push:
    branches: [github-action-gate]   # the branch build that reports baseline merges into it

permissions:
  contents: read
  checks: write
  pull-requests: read

jobs:
  visual:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with: {node-version: 22, cache: npm}
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - uses: applitools/eyes-github-action@5e83ac72ef0d1c92e30f7314d2d80fe4cc813bdc
        env:
          STORYBOOK_DISABLE_TELEMETRY: '1'
        with:
          apiKey: ${{ secrets.APPLITOOLS_API_KEY }}
          readApiKey: ${{ secrets.APPLITOOLS_READ_KEY }}
          expectApps: Applitools Website, Storybook Sandbox
          run: |
            npx playwright test
            PUPPETEER_EXECUTABLE_PATH=$(which google-chrome) npx eyes-storybook
