name: Applitools refresh
on:
  # The README uses pull_request_target, which runs main's copy of this file; this test branch's copy needs
  # pull_request. schedule and workflow_dispatch only fire from the default branch.
  pull_request:
    types: [labeled, unlabeled]

permissions:
  checks: write
  pull-requests: read

jobs:
  refresh:
    if: github.event.label.name == 'design-review'
    runs-on: ubuntu-latest
    steps:
      - uses: applitools/eyes-github-action@2e1a1cce760574103f9d1b4dc3a5cd8d3e8bcb1f
        with:
          mode: refresh
          readApiKey: ${{ secrets.APPLITOOLS_READ_KEY }}
